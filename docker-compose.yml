services:
  mysql:
    image: mysql:8.0
    container_name: welabs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-12345678}"
      MYSQL_DATABASE: "${DB_NAME:-welabs_monitoring}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      # 호스트포트:컨테이너포트  — 네이티브 MySQL(3306)과 충돌 피하려고 기본 3307.
      # .env 에서 DB_PORT 로 변경 가능 (앱도 같은 DB_PORT 를 읽음).
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 컨테이너 "최초 기동(빈 볼륨)" 시 *.sql 을 파일명 순으로 자동 실행:
      #   schema.sql  →  v6-schema.sql  (student_master 의존성 순서 보장됨)
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-12345678}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
